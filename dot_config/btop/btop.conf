# btop: catppuccin latte (theme vendored at themes/catppuccin_latte.theme).
# save_config_on_exit = false keeps btop from rewriting this managed file on
# exit (btop otherwise dumps its full config back, which shows up as permanent
# chezmoi drift). In-app setting changes are therefore not persisted - edit this
# file (and commit) instead.
# Set theme_background = False to let the terminal background show through.
color_theme = "catppuccin_latte"
save_config_on_exit = false
